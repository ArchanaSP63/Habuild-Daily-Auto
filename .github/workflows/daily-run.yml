name: Daily Playwright Run

permissions:
  contents: write

on:
  schedule:
    # Edmonton is UTC-6 in daylight time and UTC-7 in standard time.
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.local-time.outputs.should_run }}
    steps:
      - name: Check Edmonton local time
        id: local-time
        run: |
          if [ "$(TZ=America/Edmonton date +%H)" = "19" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  run-test:
    needs: check-schedule
    if: github.event_name == 'workflow_dispatch' || needs.check-schedule.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Habuild Test Script
        run: npx playwright test tests/Habuild.spec.js

      # Optional: Upload generated Excel file or test report as an artifact
      - name: Upload Output Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: |
            youtube-links.xlsx
            playwright-report/
          retention-days: 7

      - name: Commit updated YouTube links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube-links.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "Update daily YouTube links"
            git push
          fi